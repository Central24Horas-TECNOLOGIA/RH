name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check apps/backend
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxe JavaScript
        run: find apps/frontend/fonte -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Smoke tests do frontend
        run: |
          node apps/frontend/tests/run-rh-business-rules-smoke.cjs
          node apps/frontend/tests/run-process-details-rules-smoke.cjs
          node apps/frontend/tests/run-excel-correction-smoke.cjs
          node apps/frontend/tests/run-conecta-provas-flow-smoke.cjs
          node apps/frontend/tests/run-refresh-performance-smoke.cjs

  build-images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
