name: conecta-dev

services:
  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    env_file:
      - env/dev.env
    environment:
      RH_APP_ENV: dev
      RH_FRONT_SERVE_STATIC: "false"
    volumes:
      - ../../data/private:/app/data/private
    networks:
      - conecta-dev-net
      - conecta-ops-net
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    environment:
      CONECTA_HOST: localhost
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - conecta-dev-net
    restart: unless-stopped

  analytics-worker:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    command: ["python", "-m", "rh_api.workers.exam_analytics", "--poll-seconds", "5"]
    env_file:
      - env/dev.env
    environment:
      RH_APP_ENV: dev
      RH_FRONT_SERVE_STATIC: "false"
    volumes:
      - ../../data/private:/app/data/private
    networks:
      - conecta-dev-net
      - conecta-ops-net
    restart: unless-stopped
    healthcheck:
      disable: true

networks:
  conecta-dev-net:
    name: conecta-dev-net
  conecta-ops-net:
    name: conecta-ops-net
